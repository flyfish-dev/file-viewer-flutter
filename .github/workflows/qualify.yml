name: Qualify development preview

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:
    inputs:
      pub_archive_transfer:
        description: Transfer public base-resource bytes using a temporary storage form (no pub credentials)
        type: boolean
        default: false
      compatibility_only:
        description: Verify native and web compatibility before new component versions are published
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_REVISION: 9584c6713b324636289d067944a46fd6b49df14b
  FILE_VIEWER_NATIVE_CACHE_DIR: ${{ github.workspace }}/.build/native-archives

jobs:
  checks:
    if: ${{ !inputs.pub_archive_transfer && !inputs.compatibility_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: npm ci --prefix runtime
      - run: npm run check --prefix runtime
      - run: npm test --prefix runtime
      - name: Verify generated resource bytes and manifests
        run: |
          node tool/build-runtime.mjs
          git diff --exit-code -- packages/file_viewer_flutter_assets*
      - name: Build local SDK
        run: python3 tool/bundle-sdk.py
      - name: Validate isolated pub archives
        run: python3 tool/check-pub.py --staging-directory "$RUNNER_TEMP/file-viewer-pub"
      - name: Require full publication score
        run: |
          dart pub global activate pana 0.23.19
          (cd "$RUNNER_TEMP/file-viewer-pub/file_viewer_flutter" && flutter pub publish --to-archive "$RUNNER_TEMP/file_viewer_flutter.tar.gz")
          python3 tool/check-score.py "$RUNNER_TEMP/file_viewer_flutter.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-sdk
          path: .release/*sdk.tar.gz*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: publication-score
          path: .release/pub-score/
          retention-days: 14

  desktop:
    if: ${{ !inputs.pub_archive_transfer }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: windows-2025
            platform: windows
            arch: x64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libnss3-dev libxss-dev libgbm-dev xvfb
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/native-archives
          key: native-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/native-runtime-lock.json') }}
      - run: flutter config --enable-linux-desktop --enable-macos-desktop --enable-windows-desktop
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: dart run file_viewer_flutter:setup --project . --platform ${{ matrix.platform }} --apply
        working-directory: example
      - run: flutter build ${{ matrix.platform }} --debug
        if: matrix.platform != 'linux'
        working-directory: example
      - name: Build Linux integration binary
        if: matrix.platform == 'linux'
        run: flutter build linux --debug --target integration_test/viewer_test.dart
        working-directory: example
      - name: Build macOS integration binary
        if: matrix.platform == 'macos'
        run: flutter build macos --debug --no-pub --target integration_test/viewer_test.dart --dart-define=FILE_VIEWER_DIAGNOSTICS=true
        working-directory: example
      - name: Prepare the verified CEF sandbox helper
        if: matrix.platform == 'linux'
        run: |
          helper="example/build/linux/${{ matrix.arch }}/debug/bundle/lib/chrome-sandbox"
          test -x "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
      - name: Real Linux CEF integration (sandbox remains enabled)
        if: matrix.platform == 'linux'
        run: xvfb-run -a flutter drive --driver test_driver/integration_test.dart --target integration_test/viewer_test.dart --use-application-binary build/linux/${{ matrix.arch }}/debug/bundle/file_viewer_flutter_example --debug -d linux --no-pub
        working-directory: example
      - name: Real macOS WKWebView integration
        if: matrix.platform == 'macos'
        run: flutter drive --driver test_driver/integration_test.dart --target integration_test/viewer_test.dart --use-application-binary "build/macos/Build/Products/Debug/File Viewer.app" --debug -d macos --no-pub
        working-directory: example
      - name: Real Windows integration
        if: matrix.platform == 'windows'
        run: flutter test integration_test/viewer_test.dart -d ${{ matrix.platform }} --no-pub --dart-define=FILE_VIEWER_DIAGNOSTICS=true
        working-directory: example
      - name: Retain native integration receipt
        if: ${{ always() && matrix.platform != 'windows' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: example/build/integration_response_data.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify Windows runtime signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $engines = Get-ChildItem example/build/windows -Filter msedgewebview2.exe -Recurse
          if ($engines.Count -lt 1) { throw 'Bundled runtime was not installed.' }
          foreach ($engine in $engines) {
            $signature = Get-AuthenticodeSignature $engine.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
              throw 'Bundled WebView2 signature is invalid.'
            }
          }

  web:
    if: ${{ !inputs.pub_archive_transfer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - run: npm ci --prefix runtime
      - run: npx --prefix runtime playwright install --with-deps chromium
      - run: flutter build web --no-web-resources-cdn
        working-directory: example
      - run: node tool/verify-web.mjs
      - run: flutter build web --wasm --no-web-resources-cdn
        working-directory: example
      - run: node tool/verify-web.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: .release/web
          retention-days: 14

  pub-archive-transfer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.pub_archive_transfer }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" checkout "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Validate and transfer public archive (publication remains local)
        env:
          PUB_UPLOAD_FORM: ${{ secrets.FILE_VIEWER_PUB_UPLOAD_FORM }}
        run: python3 tool/stage-pub-transfer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pub-base-transfer
          path: .release/pub-transfer
          retention-days: 1
