name: file_viewer_flutter_linux
description: Linux CEF adapter for File Viewer Flutter, derived from webview_cef.
version: 0.1.0-dev.2
repository: https://github.com/flyfish-dev/file-viewer-flutter
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      linux:
        pluginClass: FileViewerFlutterLinuxPlugin

