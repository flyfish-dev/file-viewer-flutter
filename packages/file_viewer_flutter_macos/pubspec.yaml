name: file_viewer_flutter_macos
description: Retained WKWebView adapter with isolated view ownership for File Viewer Flutter.
version: 0.1.0-dev.1
repository: https://github.com/flyfish-dev/file-viewer-flutter
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: 1.4.0-beta.3
flutter:
  plugin:
    implements: file_viewer_flutter
    platforms:
      macos:
        pluginClass: FileViewerFlutterMacosPlugin
